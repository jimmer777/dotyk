<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dotyk materiału</title>
<style>
  :root { --bg:#111; --fg:#eee; --mut:#9a9a9a; --chip:#262626; --acc:#e8c26a; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:16px/1.35 system-ui, -apple-system, sans-serif; overflow:hidden; overscroll-behavior:none; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  header { padding:calc(10px + env(safe-area-inset-top)) 16px 6px; }
  h1 { margin:0; font-size:21px; }
  #desc { margin:3px 0 4px; font-size:14px; color:#c9c9c9; min-height:2.7em; }
  .row { display:flex; gap:12px; align-items:center; font-size:12px; color:var(--mut); }
  .row input { flex:1; accent-color:var(--acc); }
  .tb { border:0; border-radius:8px; padding:6px 10px; background:#3a3a3a; color:var(--fg); }
  #snd { margin-left:auto; }
  #pad { flex:1; position:relative; touch-action:none; user-select:none; -webkit-user-select:none; }
  #pad canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  nav { display:flex; gap:6px; overflow-x:auto; padding:8px 12px calc(10px + env(safe-area-inset-bottom)); }
  nav button { flex:0 0 auto; border:0; border-radius:999px; padding:10px 14px; background:var(--chip);
    color:var(--fg); font-size:15px; }
  nav button.on { background:var(--acc); color:#111; }
  #start { position:fixed; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.85);
    font-size:20px; text-align:center; padding:24px; z-index:5; }
  #start small { display:block; margin-top:10px; font-size:13px; color:var(--mut); }
  #warn { color:#ff9b7a; }
  .ios-tap { position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="name"></h1>
    <p id="desc"></p>
    <div class="row">
      <span id="meta"></span>
      <label for="gain">Siła</label><input id="gain" type="range" min="0.5" max="3" step="0.25" value="1">
      <span id="gainv">×1</span>
    </div>
    <div class="row"><span id="count"></span><span id="warn"></span><button id="snd" class="tb"></button><button id="test" class="tb">Test 0,5 s</button></div>
  </header>
  <div id="pad"><canvas id="base"></canvas><canvas id="fx"></canvas></div>
  <nav id="mats"></nav>
</div>
<div id="start"><div>Dotknij, żeby zacząć<small>Przesuwaj jednym lub kilkoma palcami. Stuknięcie = ciężar.<br>
  Telefon nie może być na „Wycisz” — Chrome wtedy w ogóle nie wibruje.</small></div></div>
<label class="ios-tap" id="iosTap"><input type="checkbox" switch></label>

<script src="vibcheck.js"></script>
<script>
// One motor shakes the whole phone and navigator.vibrate can only switch it on/off for N ms,
// so materials differ by time signature: where pulses fire (texture from the description),
// on/off rhythm while sliding, and how long and echoey a tap is (weight from density).
// Pattern arrays alternate [on, off, on, off, ...] in ms.
const MATERIALS = [
  { name:'Sztruks', density:0.4, kind:'lines', step:16, jitter:0, lw:7, pulse:[14], tap:[10], snd:{ f:900, q:1.2, vol:0.35 },
    bg:'#7a5a32', fg:'#5c4223', desc:'Równe, miękkie prążki. W poprzek: równy rytm. Wzdłuż: cisza.' },
  { name:'Drewno', density:0.6, kind:'lines', step:40, jitter:0.7, lw:3, pulse:[6], knot:[6, 30, 6], tap:[18], snd:{ f:2200, q:3, vol:0.6 },
    bg:'#b98a52', fg:'#8a5e2f', desc:'Rzadkie, nierówne słoje: suche kliknięcia, czasem sęk (podwójny klik).' },
  { name:'Piasek', density:1.6, kind:'stream', on:[2, 5], off:[25, 80], tap:[30], snd:{ f:3500, q:0.8, vol:0.35 },
    bg:'#d9c08a', fg:'#a88b52', desc:'Sypki chrzęst: losowe drobne trzaski, gęstsze, im szybciej suniesz.' },
  { name:'Papier ścierny', density:1.2, kind:'stream', on:[4, 7], off:[6, 12], tap:[22], snd:{ f:2800, q:0.6, vol:0.4 },
    bg:'#3b3a36', fg:'#8c8a80', desc:'Ostre, gęste ziarno: ciągłe, szorstkie rzężenie.' },
  { name:'Bruk', density:2.6, kind:'grid', step:84, pulse:[45, 40, 20], tap:[55, 25, 25], snd:{ f:220, q:1.5, vol:0.9 },
    bg:'#2d2d2d', fg:'#7d7a74', desc:'Gładkie kamienie, głębokie fugi: cisza, potem ciężkie „łup” na szczelinie.' },
  { name:'Stal', density:7.8, kind:'stream', on:[90, 90], off:[0, 0], tap:[80, 30, 40, 30, 20, 30, 10], snd:{ f:5000, q:0.5, vol:0.12, tone:1400 },
    bg:'#9ea3a8', fg:'#7f858b', desc:'Śliska i bardzo gęsta: równy, ciągły szum pod palcem. Stuk ciężki, z pogłosem.' },
  { name:'Szkło', density:2.5, kind:'smooth', tap:[8, 40, 6, 40, 4, 40, 3], snd:{ f:4000, q:4, vol:0.3, tone:2600 },
    bg:'#1f3540', fg:'#5a8aa0', desc:'Idealnie gładkie: przesuwanie w ciszy. Stuknięcie dzwoni.' },
];

const $ = id => document.getElementById(id);
const pad = $('pad'), base = $('base'), fxc = $('fx');
const bctx = base.getContext('2d'), fctx = fxc.getContext('2d');
const fingers = new Map(); // pointerId -> {x, y, t}
const fx = [];
let m = MATERIALS[0], gain = 1, W = 0, H = 0, lines = [], pulses = 0;
let busyUntil = 0, streaming = false, speed = 0, lastMoveT = 0;

if (!navigator.vibrate) $('warn').textContent = 'brak API wibracji (iPhone?) — tryb awaryjny';

function rng(seed) { // mulberry32: same pattern every redraw
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const between = ([a, b]) => a + Math.random() * (b - a);

function updateCount() { $('count').textContent = `impulsy: ${pulses} · palce: ${fingers.size}`; }

// Sound in sync with every "on" segment: hearing friction makes the vibration read as texture.
let ac = null, noise = null, soundOn = true;
try { soundOn = localStorage.getItem('dotyk.sound') !== 'off'; } catch {}

function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noise.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

function sound(p, tap) {
  if (!ac || !soundOn) return;
  const s = m.snd;
  let t = ac.currentTime + 0.005;
  p.forEach((v, i) => {
    if (i % 2 === 0 && v > 0) {
      const dur = Math.max(0.004, v / 1000), end = t + dur + 0.02;
      const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = noise; bp.type = 'bandpass'; bp.frequency.value = s.f; bp.Q.value = s.q;
      g.gain.setValueAtTime(s.vol, t); g.gain.exponentialRampToValueAtTime(0.001, end);
      src.connect(bp).connect(g).connect(ac.destination);
      src.start(t, Math.random() * 0.9, dur + 0.03);
      if (tap && s.tone) { // hard materials ring after a tap
        const o = ac.createOscillator(), og = ac.createGain();
        o.frequency.value = s.tone; og.gain.setValueAtTime(0.15 * s.vol / 0.3, t);
        og.gain.exponentialRampToValueAtTime(0.001, t + dur * 6 + 0.1);
        o.connect(og).connect(ac.destination); o.start(t); o.stop(t + dur * 6 + 0.12);
      }
    }
    t += v / 1000;
  });
}

// force=true interrupts whatever is playing; otherwise a busy motor drops the pulse.
function play(pattern, force, tap) {
  const now = performance.now();
  if (!force && now < busyUntil) return false;
  const p = pattern.map((v, i) => i % 2 ? Math.round(v) : Math.max(1, Math.round(v * gain)));
  busyUntil = now + p.reduce((a, b) => a + b, 0);
  if (navigator.vibrate) navigator.vibrate(p);
  else $('iosTap').click(); // iOS 18+ Safari: toggling a switch input gives a haptic tick
  sound(p, tap);
  pulses++; updateCount();
  return true;
}

function stopStream() {
  if (!streaming) return;
  streaming = false; busyUntil = 0;
  if (navigator.vibrate) navigator.vibrate(0);
}

// Stream materials: queue the next ~70 ms chunk just before the current one ends.
const CHUNK = 70;
setInterval(() => {
  if (m.kind !== 'stream') return;
  const now = performance.now();
  if (!fingers.size || now - lastMoveT > 90 || speed < 0.03) return stopStream();
  if (streaming && now < busyUntil - 8) return;
  const f = Math.min(3, Math.max(0.4, speed / 0.6)); // faster finger -> denser grains
  let pat;
  if (!m.off[1]) pat = [CHUNK + 20];
  else {
    pat = [];
    for (let t = 0; t < CHUNK;) {
      const on = Math.round(between(m.on)), off = Math.round(between(m.off) / f);
      pat.push(on, off); t += on + off;
    }
  }
  play(pat, true); streaming = true;
}, 10);

function layout() {
  const dpr = window.devicePixelRatio || 1;
  W = pad.clientWidth; H = pad.clientHeight;
  for (const c of [base, fxc]) { c.width = W * dpr; c.height = H * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }
  const r = rng(m.name.length * 977);
  lines = [];
  if (m.kind === 'lines') for (let x = m.step / 2; x < W; x += m.step * (1 + m.jitter * (r() - 0.5) * 2)) lines.push(x);
  drawBase();
}

function drawBase() {
  const r = rng(42), c = bctx;
  c.fillStyle = m.bg; c.fillRect(0, 0, W, H);
  c.fillStyle = m.fg;
  if (m.kind === 'lines') {
    for (const x of lines) c.fillRect(x - m.lw / 2, 0, m.lw, H);
  } else if (m.kind === 'grid') {
    const s = m.step;
    for (let y = 0; y < H; y += s) for (let x = 0; x < W; x += s) {
      const v = 0.75 + r() * 0.35; c.fillStyle = `rgb(${125 * v},${122 * v},${116 * v})`;
      c.beginPath(); c.roundRect(x + 5, y + 5, s - 10, s - 10, 16); c.fill();
    }
  } else if (m.kind === 'stream' && m.off[1]) {
    const grain = (m.on[1] + m.off[0]) / 2, n = (W * H) / (grain * grain) * 2;
    for (let i = 0; i < n; i++) { c.globalAlpha = 0.35 + r() * 0.65; c.fillRect(r() * W, r() * H, 1 + r() * 2, 1 + r() * 2); }
    c.globalAlpha = 1;
  } else if (m.kind === 'stream') { // brushed steel: faint horizontal streaks
    for (let y = 0; y < H; y += 2) { c.globalAlpha = 0.15 + r() * 0.35; c.fillRect(0, y, W, 1); }
    c.globalAlpha = 1;
  } else {
    const g = c.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, m.bg); g.addColorStop(0.5, m.fg); g.addColorStop(1, m.bg);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }
}

function crossings(a, b) {
  if (m.kind === 'lines') {
    const lo = Math.min(a.x, b.x), hi = Math.max(a.x, b.x);
    let n = 0; for (const x of lines) if (x > lo && x <= hi) n++; return n;
  }
  if (m.kind === 'grid') {
    const s = m.step, f = Math.floor;
    return Math.abs(f(b.x / s) - f(a.x / s)) + Math.abs(f(b.y / s) - f(a.y / s));
  }
  return 0;
}

const pt = e => { const r = pad.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const ripple = (p, big) => fx.push({ x: p.x, y: p.y, t: performance.now(), big });

pad.addEventListener('pointerdown', e => {
  const p = pt(e);
  fingers.set(e.pointerId, { ...p, t: e.timeStamp });
  try { pad.setPointerCapture(e.pointerId); } catch {} // touch is captured implicitly anyway
  play(m.tap, true, true); ripple(p, true); updateCount();
});
pad.addEventListener('pointermove', e => {
  const f = fingers.get(e.pointerId);
  if (!f) return;
  const co = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of co.length ? co : [e]) {
    const p = pt(ev), dt = ev.timeStamp - f.t;
    if (dt > 0) speed = speed * 0.8 + (Math.hypot(p.x - f.x, p.y - f.y) / dt) * 0.2;
    if (crossings(f, p) && play(m.knot && Math.random() < 0.18 ? m.knot : m.pulse)) ripple(p);
    f.x = p.x; f.y = p.y; f.t = ev.timeStamp;
  }
  lastMoveT = performance.now();
});
const lift = e => { fingers.delete(e.pointerId); if (!fingers.size) { speed = 0; stopStream(); } updateCount(); };
pad.addEventListener('pointerup', lift);
pad.addEventListener('pointercancel', lift);

(function loop() {
  const now = performance.now();
  fctx.clearRect(0, 0, W, H);
  fctx.lineWidth = 2;
  for (const f of fingers.values()) {
    fctx.strokeStyle = 'rgba(232,194,106,.9)';
    fctx.beginPath(); fctx.arc(f.x, f.y, 26, 0, 7); fctx.stroke();
  }
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i], k = (now - f.t) / 260;
    if (k >= 1) { fx.splice(i, 1); continue; }
    fctx.strokeStyle = `rgba(255,240,200,${1 - k})`;
    fctx.beginPath(); fctx.arc(f.x, f.y, (f.big ? 18 : 8) + k * (f.big ? 40 : 16), 0, 7); fctx.stroke();
  }
  requestAnimationFrame(loop);
})();

function select(i) {
  stopStream();
  m = MATERIALS[i];
  $('name').textContent = `${i + 1}. ${m.name}`;
  $('desc').textContent = m.desc;
  const tapMs = m.tap.filter((_, j) => j % 2 === 0).reduce((a, b) => a + b, 0);
  $('meta').textContent = `gęstość ${m.density} g/cm³ · stuk ${Math.round(tapMs * gain)} ms`;
  [...$('mats').children].forEach((b, j) => b.classList.toggle('on', j === i));
  layout();
}

MATERIALS.forEach((mat, i) => {
  const b = document.createElement('button'); b.textContent = `${i + 1}. ${mat.name}`;
  b.onclick = () => { select(i); play(m.tap, true, true); };
  $('mats').append(b);
});
$('gain').oninput = e => { gain = +e.target.value; $('gainv').textContent = '×' + gain; select(MATERIALS.indexOf(m)); };
$('test').onclick = () => { $('warn').textContent = 'vibrate → ' + (navigator.vibrate ? navigator.vibrate(500) : 'brak API'); };
$('start').onclick = () => { $('start').remove(); initAudio(); play([30], true); }; // first tap = user activation for vibrate + audio
const sndLabel = () => { $('snd').textContent = soundOn ? '🔊' : '🔇'; };
$('snd').onclick = () => { soundOn = !soundOn; sndLabel(); try { localStorage.setItem('dotyk.sound', soundOn ? 'on' : 'off'); } catch {} };
sndLabel();
addEventListener('resize', layout);
document.addEventListener('vibcheck:done', () => $('start')?.click()); // the answer tap also unlocks audio
if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
select(0);
updateCount();
</script>
</body>
</html>
